<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="C++ Learning App — Master modern C++ with an interactive, beautiful learning experience."
    />
    <title>C++ Learning App</title>
    <script>
      // Prevent flash of wrong theme (FOUC) by applying the saved/system
      // theme before the first paint. Must stay in sync with ThemeContext.
      (function () {
        try {
          var saved = localStorage.getItem('cpp-learning-theme');
          var theme;
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            theme = 'dark';
          } else {
            theme = 'light';
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
